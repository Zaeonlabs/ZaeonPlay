name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  NODE_VERSION: "22"

jobs:
  # ---------------------------------------------------------------------------
  # Build + stage payloads independently per OS (one failure won't block others)
  # ---------------------------------------------------------------------------
  build-windows:
    name: Build server (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/stage-release-payload
        with:
          platform: windows
          pkg_target: node22-win-x64
          server_bin: streamplugins-server.exe
          tray_bin: streamplugins-tray.exe
      - uses: actions/upload-artifact@v4
        with:
          name: staged-windows
          path: dist/
          if-no-files-found: error

  build-macos:
    name: Build server (macos)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/stage-release-payload
        with:
          platform: macos
          pkg_target: node22-macos-x64
          server_bin: streamplugins-server
          tray_bin: streamplugins-tray
      - uses: actions/upload-artifact@v4
        with:
          name: staged-macos
          path: dist/
          if-no-files-found: error

  build-linux:
    name: Build server (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/stage-release-payload
        with:
          platform: linux
          pkg_target: node22-linux-x64
          server_bin: streamplugins-server
          tray_bin: streamplugins-tray
      - uses: actions/upload-artifact@v4
        with:
          name: staged-linux
          path: dist/
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Package installers per platform
  # ---------------------------------------------------------------------------
  package-windows:
    name: Package Windows installers
    needs: build-windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: staged-windows
          path: dist

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup -y --no-progress

      - name: Build Windows installers
        shell: pwsh
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          $root = $env:GITHUB_WORKSPACE
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            throw "Inno Setup compiler not found at $iscc"
          }
          New-Item -ItemType Directory -Force -Path "$root\dist\installers" | Out-Null
          $common = @(
            "/DMyAppVersion=$env:VERSION",
            "/O$root\dist\installers"
          )
          & $iscc @common "/DSourceDir=$root\dist\obs-plugin-windows" "$root\installer\windows\setup.iss"
          & $iscc @common "/DSourceDir=$root\dist\tray-app-windows" "$root\installer\windows\tray-setup.iss"
          Get-ChildItem "$root\dist\installers" | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: installers-windows
          path: dist/installers/*
          if-no-files-found: error

  package-macos:
    name: Package macOS installers
    needs: build-macos
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: staged-macos
          path: dist

      - name: Resolve version
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build macOS installers
        run: |
          chmod +x installer/macos/build-pkg.sh
          ./installer/macos/build-pkg.sh --variant=obs-plugin --version=${{ steps.ver.outputs.version }}
          ./installer/macos/build-pkg.sh --variant=tray-app --version=${{ steps.ver.outputs.version }}
          ls -la dist/installers

      - uses: actions/upload-artifact@v4
        with:
          name: installers-macos
          path: dist/installers/*
          if-no-files-found: error

  package-linux:
    name: Package Linux installers
    needs: build-linux
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: staged-linux
          path: dist

      - name: Resolve version
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build Linux installers
        run: |
          chmod +x installer/linux/build-deb.sh
          ./installer/linux/build-deb.sh --variant=obs-plugin --version=${{ steps.ver.outputs.version }}
          ./installer/linux/build-deb.sh --variant=tray-app --version=${{ steps.ver.outputs.version }}
          ls -la dist/installers

      - uses: actions/upload-artifact@v4
        with:
          name: installers-linux
          path: dist/installers/*
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Publish GitHub Release (publishes whatever platform packages succeeded)
  # ---------------------------------------------------------------------------
  release:
    name: Create GitHub Release
    needs: [package-windows, package-macos, package-linux]
    if: >-
      always() &&
      (
        needs.package-windows.result == 'success' ||
        needs.package-macos.result == 'success' ||
        needs.package-linux.result == 'success'
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Windows installers
        if: needs.package-windows.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: installers-windows
          path: release-assets

      - name: Download macOS installers
        if: needs.package-macos.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: installers-macos
          path: release-assets

      - name: Download Linux installers
        if: needs.package-linux.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: installers-linux
          path: release-assets

      - name: List release assets
        run: find release-assets -type f | sort

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: release-assets/**
          body: |
            ## StreamPlugins ${{ github.ref_name }}

            ### Install options

            **Native OBS Plugin (recommended)** — install, restart OBS, docks appear automatically:
            - Windows: `streamplugins-*-obs-plugin-windows-x64.exe`
            - macOS: `streamplugins-*-obs-plugin-macos-universal.pkg`
            - Linux: `streamplugins-*-obs-plugin-linux-x86_64.deb`

            **Standalone Tray App** — launch the app, then paste `localhost:3847` URLs into OBS:
            - Windows: `streamplugins-*-tray-app-windows-x64-setup.exe`
            - macOS: `streamplugins-*-tray-app-macos-universal.pkg`
            - Linux: `streamplugins-*-tray-app-linux-x86_64.deb`

            See [docs/DEPLOYMENT.md](docs/DEPLOYMENT.md) for full install instructions.

            > Note: Native OBS plugin C++ binary requires OBS SDK build in CI.
            > Early releases may ship plugin data + server with a placeholder native binary
            > until the OBS SDK matrix job is fully wired.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
